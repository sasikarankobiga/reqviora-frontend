components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Candidate access-token transport; provider and token profile remain pending. Server must check
        session revocation.
  schemas:
    ProjectInfo: *id005
    ProjectSummary: *id003
    ClaimDecision: *id021
    Validation: *id014
    ValidationFinding:
      type: object
      additionalProperties: false
      properties:
        ruleId: *id004
        severity:
          enum:
          - blocker
          - advisory
        objectId: *id002
        message: *id004
        fixLink: *id004
      required:
      - ruleId
      - severity
      - message
    Job: *id010
    Approval: *id015
    ExportJob: *id016
    Grant: *id017
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          const: about:blank
        title: *id004
        status:
          type: integer
        code: *id004
        correlationId: *id002
        detail: *id004
      required:
      - title
      - status
      - code
      - correlationId
security:
- BearerAuth: []
x-contract-rules:
  draftConcurrency: If-Match strong ETag; 409 on stale
  approval: exact persisted draft version + current validation hash, explicit Approver, no material self-approval
  superAdmin: no implicit project content, export or project approval
  mock: no live transactions
  mcp: read-only approved revision scopes only
