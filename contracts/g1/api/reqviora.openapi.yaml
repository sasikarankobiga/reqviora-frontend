openapi: 3.1.0
info:
  title: REQVIORA V1 API — G1 Candidate Contract
  version: 1.0.0-candidate
  description: Candidate contract derived from BRD v0.5 and approved product/UX/RBAC baselines. Not evidence of
    an implemented service or provider sign-off.
servers:
- url: https://api.example.invalid
  description: Placeholder only — hosting/domain pending
tags:
- name: AI Review
- name: Accounts
- name: Admin
- name: Approval
- name: Audit
- name: Blueprint
- name: Builder
- name: Design
- name: Drafts
- name: Exports
- name: Features
- name: Interactions
- name: MCP
- name: Membership
- name: Preview
- name: Projects
- name: Requirements
- name: Routes
- name: Screens
- name: Sharing
- name: Sources
- name: Traceability
- name: Validation
paths:
  /api/v1/me:
    get:
      tags:
      - Accounts
      summary: Read current authenticated account
      operationId: get_api_v1_me
      x-rbac-action: RBAC-01
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful read current authenticated account
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  userId: &id002
                    type: string
                    format: uuid
                  accountStatus:
                    enum:
                    - active
                    - suspended
                    - disabled
                  verified:
                    type: boolean
                required:
                - userId
                - accountStatus
                - verified
        '400': &id001
          description: Typed problem response
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
  /api/v1/projects:
    get:
      tags:
      - Projects
      summary: List projects accessible to member
      operationId: get_api_v1_projects
      x-rbac-action: RBAC-03
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful list projects accessible to member
          content:
            application/json:
              schema:
                type: array
                items: &id003
                  type: object
                  additionalProperties: false
                  properties:
                    projectId: *id002
                    name: &id004
                      type: string
                    status:
                      enum:
                      - active
                      - archived
                    currentDraftId: *id002
                    updatedAt:
                      type: string
                      format: date-time
                  required:
                  - projectId
                  - name
                  - status
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
    post:
      tags:
      - Projects
      summary: Create project and atomic Owner membership
      operationId: post_api_v1_projects
      x-rbac-action: RBAC-02
      x-contract-state: candidate-v1
      responses:
        '201':
          description: Successful create project and atomic owner membership
          content:
            application/json:
              schema: *id003
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: &id005
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 160
                description: *id004
                category: *id004
                designTargets:
                  type: array
                  items:
                    enum:
                    - web
                    - mobile
                    - desktop
                  minItems: 1
                  uniqueItems: true
                workspaceId: *id002
              required:
              - name
              - designTargets
      parameters:
      - &id009
        name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Deduplicate accepted commands within an implementation-defined retention window.
  /api/v1/projects/{projectId}:
    get:
      tags:
      - Projects
      summary: Read project overview
      operationId: get_api_v1_projects_projectId
      x-rbac-action: RBAC-03
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful read project overview
          content:
            application/json:
              schema: *id003
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
    patch:
      tags:
      - Projects
      summary: Owner update project identity and scope
      operationId: patch_api_v1_projects_projectId
      x-rbac-action: RBAC-05
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful owner update project identity and scope
          content:
            application/json:
              schema: *id003
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id005
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
      - &id006
        name: If-Match
        in: header
        required: true
        description: Opaque strong ETag of the current saved project draft returned by GET /draft; server rejects
          stale token with 409.
        schema: *id004
  /api/v1/projects/{projectId}/draft:
    get:
      tags:
      - Drafts
      summary: Get current canonical editable draft and ETag
      operationId: get_api_v1_projects_projectId_draft
      x-rbac-action: RBAC-03
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful get current canonical editable draft and etag
          content:
            application/json:
              schema:
                $ref: ../schemas/project-draft-v1.schema.json
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      description: Response includes strong ETag header representing saved version. All dependent writes must provide
        If-Match.
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
    put:
      tags:
      - Drafts
      summary: Version-safe update to current draft
      operationId: put_api_v1_projects_projectId_draft
      x-rbac-action: RBAC-09
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful version-safe update to current draft
          content:
            application/json:
              schema:
                $ref: ../schemas/project-draft-v1.schema.json
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      description: Server enforces field-level Owner/Editor/Designer permissions; document body is not wholesale
        trusted. Audit proposed vs confirmed fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/project-draft-v1.schema.json
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
      - *id006
  /api/v1/projects/{projectId}/builder:
    get:
      tags:
      - Builder
      summary: Get eight-step progress and status
      operationId: get_api_v1_projects_projectId_builder
      x-rbac-action: RBAC-03
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful get eight-step progress and status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  draftId: *id002
                  draftVersion:
                    type: integer
                  steps:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        stepNo:
                          type: integer
                          minimum: 1
                          maximum: 8
                        stage: *id004
                        status: *id004
                      required:
                      - stepNo
                      - stage
                      - status
                required:
                - draftId
                - draftVersion
                - steps
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
  /api/v1/projects/{projectId}/builder/steps/{stepNo}:
    get:
      tags:
      - Builder
      summary: Get one Builder stage payload
      operationId: get_api_v1_projects_projectId_builder_steps_stepNo
      x-rbac-action: RBAC-03
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful get one builder stage payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  stepNo:
                    type: integer
                  status: *id004
                  payload:
                    type: object
                required:
                - stepNo
                - status
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
      - &id007
        name: stepNo
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 8
    put:
      tags:
      - Builder
      summary: Save one Builder stage with version
      operationId: put_api_v1_projects_projectId_builder_steps_stepNo
      x-rbac-action: RBAC-09
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful save one builder stage with version
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  draftVersion:
                    type: integer
                    minimum: 1
                  stepNo:
                    type: integer
                  status: *id004
                required:
                - draftVersion
                - stepNo
                - status
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      description: Each stage payload must pass its versioned domain schema; completion checks distinct from save-draft.
        Step 8 name Review & Export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                stepNo:
                  type: integer
                  minimum: 1
                  maximum: 8
                payload:
                  type: object
                status:
                  enum:
                  - in-progress
                  - needs-review
                  - complete
              required:
              - stepNo
              - payload
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
      - *id007
      - *id006
  /api/v1/projects/{projectId}/builder/validate-step:
    post:
      tags:
      - Builder
      summary: Validate one Builder step
      operationId: post_api_v1_projects_projectId_builder_validate_step
      x-rbac-action: RBAC-17
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful validate one builder step
          content:
            application/json:
              schema: &id014
                type: object
                additionalProperties: false
                properties:
                  validationRunId: *id002
                  draftId: *id002
                  draftVersion:
                    type: integer
                    minimum: 1
                  draftSha256:
                    type: string
                    pattern: ^[a-f0-9]{64}$
                  status:
                    enum:
                    - ready
                    - blocked
                  blockers:
                    type: integer
                    minimum: 0
                  advisories:
                    type: integer
                    minimum: 0
                  findings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValidationFinding'
                required:
                - validationRunId
                - draftId
                - draftVersion
                - draftSha256
                - status
                - blockers
                - advisories
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                stepNo:
                  type: integer
                  minimum: 1
                  maximum: 8
                expectedDraftVersion:
                  type: integer
                  minimum: 1
              required:
              - stepNo
              - expectedDraftVersion
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
  /api/v1/projects/{projectId}/builder/migration-preview:
    post:
      tags:
      - Builder
      summary: Preview legacy seven-to-eight draft migration
      operationId: post_api_v1_projects_projectId_builder_migration_preview
      x-rbac-action: RBAC-03
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful preview legacy seven-to-eight draft migration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  legacyDraftId: *id002
                  warnings:
                    type: array
                    items: *id004
                  proposedMapping:
                    type: object
                required:
                - legacyDraftId
                - warnings
                - proposedMapping
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                legacyDraftId: *id002
              required:
              - legacyDraftId
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
  /api/v1/projects/{projectId}/sources:
    get:
      tags:
      - Sources
      summary: List permitted input sources
      operationId: get_api_v1_projects_projectId_sources
      x-rbac-action: RBAC-03
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful list permitted input sources
          content:
            application/json:
              schema:
                type: array
                items: &id008
                  type: object
                  additionalProperties: false
                  properties:
                    sourceId: *id002
                    kind:
                      enum:
                      - pdf
                      - docx
                      - txt
                      - voice
                      - text
                      - manual
                    status: *id004
                    fileName: *id004
                  required:
                  - sourceId
                  - kind
                  - status
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
  /api/v1/projects/{projectId}/sources/text:
    post:
      tags:
      - Sources
      summary: Create text or manual source
      operationId: post_api_v1_projects_projectId_sources_text
      x-rbac-action: RBAC-06
      x-contract-state: candidate-v1
      responses:
        '201':
          description: Successful create text or manual source
          content:
            application/json:
              schema: *id008
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                kind:
                  enum:
                  - text
                  - manual
                text:
                  type: string
                  minLength: 1
                  maxLength: 200000
              required:
              - kind
              - text
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
      - *id009
  /api/v1/projects/{projectId}/sources/files:
    post:
      tags:
      - Sources
      summary: Upload PDF DOCX TXT file
      operationId: post_api_v1_projects_projectId_sources_files
      x-rbac-action: RBAC-06
      x-contract-state: candidate-v1
      responses:
        '202':
          description: Successful upload pdf docx txt file
          content:
            application/json:
              schema: *id008
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      description: Provider-neutral multipart upload; enforce media sniff, size/type/malware checks and private
        object storage. Upload maxima and privacy retention pending.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                consentReference: *id004
              required:
              - file
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
      - *id009
  /api/v1/projects/{projectId}/transcripts/{transcriptId}:
    patch:
      tags:
      - Sources
      summary: Correct speech transcript before AI review
      operationId: patch_api_v1_projects_projectId_transcripts_transcriptId
      x-rbac-action: RBAC-06
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful correct speech transcript before ai review
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  transcriptId: *id002
                  status:
                    const: corrected
                required:
                - transcriptId
                - status
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text:
                  type: string
                  maxLength: 200000
                language:
                  enum:
                  - ta
                  - en
                  - mixed
              required:
              - text
              - language
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
      - name: transcriptId
        in: path
        required: true
        schema: *id002
      - *id006
  /api/v1/projects/{projectId}/transcription-jobs:
    post:
      tags:
      - Sources
      summary: Request consented speech transcription
      operationId: post_api_v1_projects_projectId_transcription_jobs
      x-rbac-action: RBAC-06
      x-contract-state: candidate-v1
      responses:
        '202':
          description: Successful request consented speech transcription
          content:
            application/json:
              schema: &id010
                type: object
                additionalProperties: false
                properties:
                  jobId: *id002
                  kind:
                    enum:
                    - document-parse
                    - speech-transcription
                    - requirements-analysis
                    - ui-generation
                    - canonical-export
                  status:
                    enum:
                    - queued
                    - running
                    - partial
                    - completed
                    - failed
                    - cancelled
                  createdAt:
                    type: string
                    format: date-time
                  errorCode: *id004
                required:
                - jobId
                - kind
                - status
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sourceId: *id002
                language:
                  enum:
                  - ta
                  - en
                  - mixed
                consentId: *id002
              required:
              - sourceId
              - language
              - consentId
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
      - *id009
  /api/v1/projects/{projectId}/analysis-jobs:
    post:
      tags:
      - AI Review
      summary: Start optional provider-gateway analysis
      operationId: post_api_v1_projects_projectId_analysis_jobs
      x-rbac-action: RBAC-07
      x-contract-state: candidate-v1
      responses:
        '202':
          description: Successful start optional provider-gateway analysis
          content:
            application/json:
              schema: *id010
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      description: G0-07 provider/service decision remains deferred; schema defines a safe interface only, never
        presumes remote provider selection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sourceIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: *id002
                expectedDraftVersion:
                  type: integer
                  minimum: 1
              required:
              - sourceIds
              - expectedDraftVersion
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
      - *id009
  /api/v1/projects/{projectId}/analysis-jobs/{jobId}:
    get:
      tags:
      - AI Review
      summary: Get asynchronous job state
      operationId: get_api_v1_projects_projectId_analysis_jobs_jobId
      x-rbac-action: RBAC-07
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful get asynchronous job state
          content:
            application/json:
              schema: *id010
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
      - name: jobId
        in: path
        required: true
        schema: *id002
  /api/v1/projects/{projectId}/candidate-claims:
    get:
      tags:
      - AI Review
      summary: List suggestions with source evidence
      operationId: get_api_v1_projects_projectId_candidate_claims
      x-rbac-action: RBAC-03
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful list suggestions with source evidence
          content:
            application/json:
              schema: &id011
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: &id012
                      type: object
                      additionalProperties: false
                      properties:
                        objectId: *id002
                        projectId: *id002
                        title: *id004
                        status: *id004
                        payload:
                          type: object
                        revisionToken: *id004
                      required:
                      - objectId
                      - projectId
                      - title
                      - status
                  nextCursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      parameters:
      - name: projectId
        in: path
        required: true
        schema: *id002
  /api/v1/projects/{projectId}/candidate-claims/{claimId}/decision:
    post:
      tags:
      - AI Review
      summary: Submit authoritative Owner decision or Editor proposal
      operationId: post_api_v1_projects_projectId_candidate_claims_claimId_decision
      x-rbac-action: RBAC-08
      x-contract-state: candidate-v1
      responses:
        '200':
          description: Successful submit authoritative owner decision or editor proposal
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  candidateId: *id002
                  status:
                    enum:
                    - suggested
                    - confirmed
                    - rejected
                    - deferred
                  decisionActorId: *id002
                required:
                - candidateId
                - status
                - decisionActorId
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
      description: Editor proposal does not confirm. Server enforces AC-01D C1 Owner-only confirmed status.
      requestBody:
        required: true
        content:
          application/json:
            schema: &id021
              type: object
              additionalProperties: false
              properties:
                decision:
                  enum:
                  - confirm
                  - reject
                  - defer
                  - propose-edit
                reason:
                  type: string
                  maxLength: 3000
                editedText:
                  type: string
                  maxLength: 10000
                expectedDraftVersion:
                  type: integer
                  minimum: 1
              required:
              - decision
