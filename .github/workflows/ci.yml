name: REQVIORA Frontend CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter static analysis
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Web
        run: flutter build web --release --no-pub --dart-define=REQVIORA_API_BASE_URL=https://example.invalid --dart-define=REQVIORA_LOCAL_DEMO=false

      - name: G1 contract fixture checks
        run: |
          python3 -m pip install -r scripts/contract-requirements.txt
          python3 contracts/g1/tests/validate_pack.py
