name: reqviora_frontend
description: REQVIORA responsive Flutter Web frontend
publish_to: none
version: 0.2.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_riverpod: 3.0.0
  go_router: 16.0.0
  http: 1.4.0
  http_parser: ^4.1.2
  uuid: 4.5.1
  intl: any
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/illustrations/
    - assets/mock_data/
    - assets/templates/